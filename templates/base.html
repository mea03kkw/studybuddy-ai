<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>StudyBuddy AI - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Mobile-first responsive design */
        body { 
            background-color: #f8f9fa; 
            padding-top: 56px;
            font-size: 0.95rem;
        }
        
        /* Compact navbar */
        .navbar {
            min-height: 56px;
            padding: 0.4rem 0;
        }
        
        .navbar-brand {
            font-size: 1.1rem;
            padding: 0.2rem 0;
        }
        
        .nav-link {
            padding: 0.4rem 0.75rem !important;
            font-size: 0.9rem;
        }
        
        /* Compact containers */
        .container {
            padding-left: 10px;
            padding-right: 10px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding-left: 8px;
                padding-right: 8px;
            }
            
            .navbar {
                min-height: 52px;
            }
            
            .navbar-brand {
                font-size: 1rem;
            }
        }
        
        /* Optimized headings */
        h1 { font-size: 1.8rem; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.3rem; }
        h4 { font-size: 1.1rem; }
        h5 { font-size: 1rem; }
        h6 { font-size: 0.95rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">🧠 StudyBuddy</a>
            {% if current_user.is_authenticated %}
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">🏠</a>
                    <a class="nav-link" href="{{ url_for('chat') }}">🤖</a>
                    <a class="nav-link" href="{{ url_for('flashcards') }}">📝</a>
                    <a class="nav-link" href="{{ url_for('progress') }}">📊</a>
                    <a class="nav-link" href="{{ url_for('logout') }}">🔓</a>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-3">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info alert-dismissible fade show py-2">
                        <small>{{ message }}</small>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
